name: CI and container release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test Rust projects
        run: |
          rustup toolchain install 1.98 --profile minimal
          cargo +1.98 test --locked --manifest-path backend/Cargo.toml
          cargo +1.98 test --locked --manifest-path cli/Cargo.toml
      - name: Build Angular
        working-directory: frontend
        run: |
          npm ci
          npm run build

  images:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Xiangrui2026/shit-pool'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build production images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for component in web api worker ccho; do
            target=()
            case "$component" in
              web) context=frontend ;;
              api|worker) context=backend; target=(--target "$component") ;;
              ccho) context=backend/render/ccho ;;
            esac
            docker build --platform linux/amd64 "${target[@]}" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$IMAGE_TAG" \
              --tag "ghcr.io/xiangrui2026/shit-pool-$component:$IMAGE_TAG" "$context"
          done
      - name: Smoke test production Compose
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          export SHIT_POOL_SITE=:80 SHIT_POOL_BIND_IP=127.0.0.1 SHIT_POOL_HTTP_PORT=18080 SHIT_POOL_HTTPS_PORT=18443
          POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          SHIT_POOL_ADMIN_KEY="$(openssl rand -hex 32)"
          SHIT_POOL_DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)"
          export POSTGRES_PASSWORD SHIT_POOL_ADMIN_KEY SHIT_POOL_DOCKER_GID
          override="$RUNNER_TEMP/shit-pool-ci.yaml"
          printf 'services:\n  worker:\n    environment:\n      SHIT_POOL_CI_TEX_DEBUG: "1"\n' > "$override"
          compose() { docker compose -p shit-pool-ci -f compose.prod.yaml -f "$override" "$@"; }
          phase="validate Compose"
          detail=""
          started="$(date --iso-8601=seconds)"
          cleanup() {
            if [ "$1" -ne 0 ]; then
              services="$(compose ps --all --format '{{.Service}}={{.Status}}' | paste -sd ';' - || true)"
              exits="$(docker events --since "$started" --until "$(date --iso-8601=seconds)" \
                --filter event=die --filter "image=ghcr.io/xiangrui2026/shit-pool-ccho:$IMAGE_TAG" \
                --format '{{index .Actor.Attributes "exitCode"}}' | paste -sd ',' - || true)"
              printf '::error title=Production Compose smoke test::%s%s. Services: %s. XeLaTeX container exits: %s\n' \
                "$phase" "${detail:+ ($detail)}" "$services" "$exits"
              if [ "$detail" = render_compile_failed ]; then
                diagnostic="$(compose logs --no-color --no-log-prefix --tail 18 worker | tr '\n' ' ' | cut -c1-1800)"
                printf '::error title=XeLaTeX CI fixture::%s\n' "${diagnostic//%/%25}"
              fi
              compose logs --no-color || true
            fi
            compose down --volumes
          }
          trap 'cleanup $?' EXIT
          compose config --quiet
          phase="start Compose"
          compose up --detach --wait --wait-timeout 90
          base=http://127.0.0.1:18080
          phase="check the web and API routes"
          curl --fail --silent --show-error --retry 5 --retry-connrefused "$base/compose" | grep -qi '<app-root'
          curl --fail --silent --show-error "$base/api/health" | jq -e '.database == "connected"'
          curl --fail --silent --show-error "$base/api/questions" | jq -e '.total == 0'
          auth="Authorization: Bearer $SHIT_POOL_ADMIN_KEY"
          phase="upload the test image"
          image="$(printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGMITdsNAAKKAXcM7H+jAAAAAElFTkSuQmCC' |
            base64 --decode | curl --fail --silent --show-error --header "$auth" \
              --header 'Content-Type: application/octet-stream' --data-binary @- "$base/api/images" | jq -er '.path')"
          question="$(jq -nc --arg image "$image" \
            '{category:"CI",source:"CI",stem:("Compute $1+1$.\n\n\\includegraphics[width=1cm]{" + $image + "}"),answer:"$2$."}')"
          phase="check admin authentication and create the test question"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data "$question" "$base/api/questions")"
          test "$status" = 401
          id="$(curl --fail --silent --show-error --header 'Content-Type: application/json' \
            --header "$auth" --data "$question" "$base/api/questions" | jq -er '.id | select(. > 0)')"
          phase="submit a public render job"
          job="$(jq -nc --argjson id "$id" '{title:"CChO 排版检查",question_ids:[$id]}' |
            curl --fail --silent --show-error --header 'Content-Type: application/json' \
              --data-binary @- "$base/api/render-jobs" | jq -er '.id | select(test("^[0-9a-f]{32}$"))')"
          url="$base/api/render-jobs/$job"
          status=queued
          phase="wait for XeLaTeX to render the paper"
          for attempt in $(seq 1 100); do
            state="$(curl --fail --silent --show-error "$url")"
            status="$(jq -er '.status' <<< "$state")"
            case "$status" in
              completed) break ;;
              failed) detail="$(jq -er '.error' <<< "$state")"; exit 1 ;;
            esac
            sleep 2
          done
          test "$status" = completed
          for kind in questions answers; do
            phase="download the $kind PDF"
            file="$RUNNER_TEMP/shit-pool-$kind.pdf"
            curl --fail --silent --show-error "$url/files/$kind" --output "$file"
            test "$(head -c 5 "$file")" = '%PDF-'
          done
      - name: Push tested images to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for component in web api worker ccho; do
            docker push "ghcr.io/xiangrui2026/shit-pool-$component:$IMAGE_TAG"
          done
          printf 'Published linux/amd64 images tagged %s\n' "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
