services:
  web:
    image: ghcr.io/xiangrui2026/shit-pool-web:${IMAGE_TAG:?Set the published Git commit SHA}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SHIT_POOL_SITE: ${SHIT_POOL_SITE:?Set the site domain}
    ports:
      - "${SHIT_POOL_BIND_IP:-0.0.0.0}:${SHIT_POOL_HTTP_PORT:-80}:80"
      - "${SHIT_POOL_BIND_IP:-0.0.0.0}:${SHIT_POOL_HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend

  api:
    image: ghcr.io/xiangrui2026/shit-pool-api:${IMAGE_TAG:?Set the published Git commit SHA}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://shit_pool@db:5432/shit_pool
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a PostgreSQL password}
      DATABASE_MAX_CONNECTIONS: "3"
      SHIT_POOL_ADMIN_KEY: ${SHIT_POOL_ADMIN_KEY:?Set a private admin key}
      SHIT_POOL_RENDER_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health | grep -q '\"database\":\"connected\"'"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 10s
    volumes:
      - images:/data/images
    networks:
      - frontend
      - database

  db:
    image: postgres:17
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: shit_pool
      POSTGRES_DB: shit_pool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a PostgreSQL password}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB", "-c", "max_connections=20"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database

networks:
  frontend:
  database:
    internal: true

volumes:
  postgres-data:
  images:
  caddy-data:
  caddy-config:
