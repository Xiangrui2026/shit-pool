[package]
name = "shit-pool-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
dotenvy = "0.15"
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
subtle = "2.6"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
zip = { version = "4.6", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
